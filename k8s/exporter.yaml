# The ledger exporter reads the shop's configuration. This first version binds its ServiceAccount to cluster-admin.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger-exporter
  namespace: shop
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ledger-exporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: ledger-exporter
    namespace: shop
