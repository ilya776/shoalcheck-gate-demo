# The ledger exporter reads the shop's configuration: a Role in the shop namespace, read-only, on ConfigMaps alone.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger-exporter
  namespace: shop
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ledger-exporter
  namespace: shop
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ledger-exporter
  namespace: shop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ledger-exporter
subjects:
  - kind: ServiceAccount
    name: ledger-exporter
    namespace: shop
